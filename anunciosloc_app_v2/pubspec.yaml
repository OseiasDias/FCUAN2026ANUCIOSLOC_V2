name: anunciosloc_app

description: AnunciosLoc - Sistema de Anuncios por Localizacao com Google Maps e MULA

publish_to: 'none'

version: 2.0.0+1


environment:
  sdk: '>=3.0.0 <4.0.0'


dependencies:

  flutter:
    sdk: flutter


  # ============================
  # Comunicação WiFi Direct / Rede P2P
  # ============================

  android_intent_plus: ^5.1.0
  wifi_iot: ^0.3.0



  # ============================
  # Notificações
  # ============================

  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  flutter_timezone: ^4.1.1



  # ============================
  # Ícones Android
  # ============================

  flutter_launcher_icons: ^0.13.1



  # ============================
  # Interface
  # ============================

  cupertino_icons: 1.0.8



  # ============================
  # SOAP / Web Services
  # ============================

  http: 1.3.0
  xml: 6.5.0



  # ============================
  # Persistência Offline
  # ============================

  shared_preferences: 2.2.3
  sqflite: 2.3.3+1
  path_provider: 2.1.3



  # ============================
  # GPS + Mapas + Geolocalização
  # ============================

  geolocator: ^13.0.1
  google_maps_flutter: 2.9.0
  geocoding: 3.0.0



  # ============================
  # Gestão de Estado
  # ============================

  provider: 6.1.2



  # ============================
  # Loading / Animações
  # ============================

  loading_animation_widget: 1.2.1



  # ============================
  # Rede e Conectividade
  # ============================

  network_info_plus: 6.0.1
  connectivity_plus: ^7.3.0



  # ============================
  # Permissões
  # ============================

  permission_handler: 11.3.1



  # ============================
  # QR Code MULA
  # ============================

  mobile_scanner: 6.0.2
  qr_flutter: 4.1.0




dev_dependencies:

  flutter_test:
    sdk: flutter

  flutter_lints: 3.0.2



flutter:

  uses-material-design: true


  assets:

    - assets/images/
    - assets/icons/